{% load static %}
<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Login Failure | Expense Tracker</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- Bootstrap -->
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="{% static 'tracker/css/auth.css' %}" />
  </head>
  <body class="auth-page">
    <div class="card auth-card p-4 text-center">
      <h4 class="mb-4 fw-bold text-danger">Login Failure</h4>
      
      <div class="alert alert-warning mb-4">
        An error occurred while attempting to login via your social account.
      </div>

      <p class="text-muted mb-4">
        This might happen if you cancelled the login or if there was a problem with the connection.
      </p>

      <a href="{% url 'account_login' %}" class="btn btn-primary w-100">Try Again</a>
      
      <p class="mt-3">
        Back to <a href="{% url 'login' %}" class="fw-semibold">Sign In</a>
      </p>
    </div>
  </body>
</html>
