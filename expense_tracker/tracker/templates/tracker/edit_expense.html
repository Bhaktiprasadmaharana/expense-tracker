{% extends 'tracker/base.html' %}

{% block content %}

<div class="edit-wrapper">

    <!-- Page Header -->
    <div class="edit-header">
        <div>
            <h2 style="margin:0;">Edit Expense</h2>
            <p style="margin:5px 0 0; color:#6b7280; font-size:14px;">
                Update the details of your expense below.
            </p>
        </div>
        <a href="{% url 'home' %}" class="back-link">
            ← Back to Dashboard
        </a>
    </div>

    <div class="card edit-card">

        <form method="POST" class="edit-form">
            {% csrf_token %}

            <!-- Title -->
            <div class="form-group">
                <label class="form-label">Title</label>
                <input 
                    type="text" 
                    name="title" 
                    value="{{ expense.title }}" 
                    class="form-control"
                    required>
            </div>

            <!-- Amount -->
            <div class="form-group">
                <label class="form-label">Amount</label>
                <input 
                    type="number" 
                    step="0.01" 
                    name="amount" 
                    value="{{ expense.amount }}" 
                    class="form-control"
                    required>
            </div>

            <!-- Category -->
            <div class="form-group">
                <label class="form-label">Category</label>
                <select name="category" class="form-control" required>
                    <option value="Food" {% if expense.category == "Food" %}selected{% endif %}>Food</option>
                    <option value="Transport" {% if expense.category == "Transport" %}selected{% endif %}>Transport</option>
                    <option value="Bills" {% if expense.category == "Bills" %}selected{% endif %}>Bills</option>
                    <option value="Entertainment" {% if expense.category == "Entertainment" %}selected{% endif %}>Entertainment</option>
                    <option value="Other" {% if expense.category == "Other" %}selected{% endif %}>Other</option>
                </select>
            </div>

            <!-- Buttons -->
            <div class="edit-actions">
                <button type="submit" class="btn btn-primary" style="flex:1;">
                    Update Expense
                </button>
                <a href="{% url 'home' %}" 
                   class="btn btn-secondary" 
                   style="flex:1; text-align:center;">
                    Cancel
                </a>
            </div>

        </form>

    </div>

</div>

{% endblock %}
