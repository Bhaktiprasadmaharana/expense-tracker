{% load static %}
<!DOCTYPE html>
<html>
  <head>
    <title>Expense Tracker</title>
    <link rel="stylesheet" href="{% static 'tracker/css/style.css' %}" />
    <script src="https://unpkg.com/lucide@latest">
      if ("serviceWorker" in navigator) {
        navigator.serviceWorker.register("{% static 'tracker/sw.js' %}")
          .then(() => console.log("Service Worker Registered"));
      }
    </script>
    <link rel="manifest" href="{% static 'tracker/manifest.json' %}" />
    <meta name="theme-color" content="#2563eb" />
  </head>
  <body>
    <div class="dashboard-layout">
      {% if user.is_authenticated %}
      <aside class="sidebar">
        <h2>💰 Tracker</h2>

        <button class="toggle-btn" onclick="toggleSidebar()">
          <i data-lucide="chevron-left" id="toggle-icon"></i>
        </button>

        <nav class="sidebar-nav">
          <a href="{% url 'home' %}" class="nav-item">
            <i data-lucide="layout-dashboard"></i>
            <span class="nav-text">Dashboard</span>
          </a>

          <a href="{% url 'categories' %}" class="nav-item">
            <i data-lucide="layers"></i>
            <span class="nav-text">Categories</span>
          </a>

          <a href="{% url 'reports' %}" class="nav-item">
            <i data-lucide="bar-chart-3"></i>
            <span class="nav-text">Reports</span>
          </a>

          <a href="{% url 'debt_list' %}" class="nav-item">
            <i data-lucide="hand-coins"></i>
            <span class="nav-text">Borrow / Debt</span>
          </a>

          <div class="nav-item">
            <i data-lucide="wallet"></i>
            <span class="nav-text wallet-amount">
              <span class="rupee-icon">₹</span>
              {{ sidebar_balance }}
            </span>
          </div>
        </nav>

        <!-- Logout at bottom -->
        <form method="POST" action="{% url 'logout' %}" class="sidebar-logout">
          {% csrf_token %}
          <button type="submit">
            <i data-lucide="log-out"></i>
            <span class="nav-text">Logout</span>
          </button>
        </form>
      </aside>
      {% endif %}

      <div class="main-content">{% block content %}{% endblock %}</div>
    </div>
    <script>
      function toggleSidebar() {
        const sidebar = document.querySelector(".sidebar");
        const icon = document.getElementById("toggle-icon");

        sidebar.classList.toggle("collapsed");

        if (sidebar.classList.contains("collapsed")) {
          icon.setAttribute("data-lucide", "chevron-right");
        } else {
          icon.setAttribute("data-lucide", "chevron-left");
        }

        lucide.createIcons();
      }

      lucide.createIcons();
    </script>
  </body>
</html>
